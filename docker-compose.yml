version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: krushi_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-krushi_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-krushi_password}
      POSTGRES_DB: ${DB_NAME:-krushi_bhandara}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-krushi_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: krushi_backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-krushi_user}:${DB_PASSWORD:-krushi_password}@postgres:5432/${DB_NAME:-krushi_bhandara}
      LLAMA_API_KEY: ${LLAMA_API_KEY}
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://localhost:11434}
      LLAMA_MODEL: ${LLAMA_MODEL:-llama2}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@krushi.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: krushi_frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_APP_NAME: "Sri Krushi Bhandara"
    ports:
      - "3000:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    command: npm run dev

volumes:
  postgres_data:

networks:
  default:
    name: krushi_network
